name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Dummy values — this build only needs to succeed, not connect to
          # a real project. Never put real secrets in a PR-triggered job.
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "ci-placeholder"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install -g firebase-tools
      - name: Run functions tests against the Firestore emulator
        # Uses firebase.emulators.json (repo root, no hosting/frameworksBackend
        # key) instead of the real firebase.json — sidesteps the
        # "webframeworks experiment" requirement entirely, and avoids
        # needing a valid project ID in .firebaserc for this CI-only run.
        working-directory: .
        run: |
          firebase emulators:exec \
            --project demo-paycore \
            --config firebase.emulators.json \
            --only firestore \
            "cd functions && npm test"

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install -g firebase-tools
      - name: Run Firestore rules tests against the emulator
        run: |
          firebase emulators:exec \
            --project demo-paycore \
            --config firebase.emulators.json \
            --only firestore \
            "cd tests/security-rules && npm ci && npm test"
