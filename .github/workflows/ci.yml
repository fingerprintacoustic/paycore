          # syntactically valid (but entirely fake and unusable) service
          # account shape. next build imports every API route to collect
          # its metadata, and admin.ts initializes the Admin SDK at
          # module-load time, so it needs SOMETHING parseable here — this
          # build never makes a real Firebase call.
