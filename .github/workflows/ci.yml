  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install -g firebase-tools
      - name: Run functions tests against the Firestore emulator
        working-directory: .
        run: |
          firebase emulators:exec \
            --project demo-paycore \
            --config firebase.emulators.json \
            --only firestore \
            "cd functions && npm test"

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm install -g firebase-tools
      - name: Run Firestore rules tests against the emulator
        run: |
          firebase emulators:exec \
            --project demo-paycore \
            --config firebase.emulators.json \
            --only firestore \
            "cd tests/security-rules && npm install && npm test"
